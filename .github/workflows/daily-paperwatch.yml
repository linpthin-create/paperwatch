name: Daily PaperWatch

on:
  schedule:
    - cron: "30 4 * * *" # 12:30 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paperwatch:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PaperWatch
        run: python -m pip install -e .

      - name: Run daily fetch
        run: paperwatch run --config config.toml --days 1 --include-sent --no-mark-sent
        env:
          # Fallback for configs that still use OPENAI_API_KEY.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY || secrets.OPENAI_API_KEY }}
          DIGEST_AI_API_KEY: ${{ secrets.DIGEST_AI_API_KEY || secrets.OPENAI_API_KEY }}
          INTEREST_BUILDER_API_KEY: ${{ secrets.INTEREST_BUILDER_API_KEY || secrets.OPENAI_API_KEY }}
          RANKING_API_KEY: ${{ secrets.RANKING_API_KEY || secrets.OPENAI_API_KEY }}
          FEISHU_ENABLED: "true"
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paperwatch-digests
          path: data/digests/*.md
          if-no-files-found: ignore

      - name: Commit generated digests
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/digests/*.md
          if git diff --cached --quiet; then
            echo "No digest changes to commit."
          else
            git commit -m "Add daily PaperWatch digest"
            git push
          fi
